# maibot_sowing_discord - 自动生成的配置文件
# Port of astrbot_sowing_discord for MaiBot with cached candidates, delayed evaluation, dynamic cooldown, and merged forwarding.

# 插件基础配置
[plugin]

# 是否启用插件。未启用时插件不会处理任何消息。
# 示例: true
enabled = true

# 配置文件版本。修改 config_schema 后应同步提升版本，便于 MaiBot 执行配置迁移。
# 示例: 1.5.0
config_version = "1.5.0"

# 源群配置：只有这些群的消息会进入候选池

[source]

# 源群群号列表。只有这些群发出的消息会进入候选池。留空等于不监听任何源群。
# 示例: ["123456789", "987654321"]
group_ids = [
    "1081895328",
    "774169604",
    "1065361498",
    "624563959",
    "128150258",
    "572782055",
    "1091819147",
]

# 目标群配置：命中的消息会被转发到这些群

[target]

# 目标群群号列表。设置后优先用于 NapCat 直接转发。留空时会回退为当前平台已知的全部群聊流。
# 示例: ["1122334455", "5566778899"]
group_ids = [
    "1081895328",
    "774169604",
    "1065361498",
    "624563959",
    "128150258",
    "572782055",
    "1091819147",
]

# 缓存与等待窗口：消息会先缓存，等待贴表情统计稳定后再评估

[cache]

# 候选消息进入缓存后，需要等待多少秒才开始评估。表情统计需要时间沉淀，这个值过小会导致误判。
# 示例: 600
wait_seconds = 600

# 是否使用后台独立协程轮询处理缓存消息。开启后，前台收消息只负责入队，转发和审核异步执行，主流程更轻，但处理会有轮询延迟。
# 示例: true
process_in_background = true

# 后台轮询间隔，单位秒。值越大越省资源，但候选消息从到期到真正处理的延迟也越大。
# 示例: 30
poll_interval_seconds = 30

# 是否把原始 `raw_message` 一并写入运行时缓存。关闭后更省内存和状态文件空间；只有在 `plain_text` 为空且消息是合并转发时才会保留必要原文。
# 示例: false
keep_raw_message = false

# 候选消息在缓存中的最大保留时间。超过这个时间还没处理就会被清理。
# 示例: 3600
max_age_seconds = 3600

# 动态冷却配置：成功转发后进入冷却，避免连续播史

[cooldown]

# 白天冷却时间，单位秒。当前时间位于白天区间时，成功转发后至少等待这么久才允许下次转发。
# 示例: 600
day_seconds = 6000

# 夜间冷却时间，单位秒。夜间一般冷却更长，用来降低深夜刷屏概率。
# 示例: 3600
night_seconds = 36000

# 白天开始时间，24 小时制，格式 HH:MM。当前逻辑中：时间 >= day_start 或 < night_start 视为白天。
# 示例: 09:00
day_start = "09:00"

# 夜间开始时间，24 小时制，格式 HH:MM。与 day_start 共同定义冷热却区间切换。
# 示例: 01:00
night_start = "01:00"

# 全局冷却下限,单位秒。无论白天/夜间,实际冷却 = max(动态冷却, 这个值)。设为 0 时不生效。
# 示例: 1800
min_seconds = 3600

# 消息过滤配置：控制哪些消息类型允许进入候选池

[filter]

# 允许进入候选池的消息类型。默认仅接收 `forward`；图片消息不再支持。若消息包含未授权的核心媒体类型，会被整条拦截。
# 示例: ["forward"]
allowed_message_types = ["forward"]

# 是否阻断源群消息的后续处理。开启后，命中源群的消息会在当前插件处停止继续流转给后续处理器。
# 示例: false
block_source_messages = false

# 评估策略配置：决定消息是否应该被转发

[evaluation]

# 候选消息评估策略。`reaction_score` 为原 AstrBot 逻辑；`keyword_llm` 为关键词预筛 + LLM 结合聊天记录审核。
# 示例: reaction_score
# 可选值: reaction_score, keyword_llm, always, keyword_any, keyword_all
strategy = "keyword_llm"

# 关键词评估策略使用的关键词列表。仅当 strategy 为 `keyword_any` 或 `keyword_all` 时生效。
# 示例: ["奶龙", "麦麦"]
keywords = []

# 关键词匹配是否区分大小写。仅对关键词策略生效，对 reaction_score 无影响。
# 示例: false
case_sensitive = false

# NapCat HTTP 配置：用于 fetch_emoji_like 和直接转发

[napcat_http]

# 是否启用 NapCat HTTP。`reaction_score` 和 `use_direct_forward` 都依赖它。
# 示例: true
enabled = true

# NapCat HTTP 服务地址。若 MaiBot 与 NapCat 在同一台机器，通常填 `127.0.0.1`。
# 示例: 127.0.0.1
host = "127.0.0.1"

# NapCat HTTP 端口。你本地 WebUI 调试页默认就是往 3000 发请求。
# 示例: 3000
port = 3000

# NapCat HTTP 鉴权 token。若 NapCat 未启用鉴权可留空；若启用了，这里必须与 NapCat 配置一致。
# 示例: your_napcat_token
access_token = ""

# NapCat HTTP 请求超时，单位秒。接口超时不会直接删缓存消息，下轮还会继续尝试。
# 示例: 10
timeout_seconds = 10

# 是否优先调用 NapCat `forward_group_single_msg` 直接转发原消息。要求 `target.group_ids` 明确填写，否则会回退到 MaiBot `send_forward()`。
# 示例: true
use_direct_forward = true

# LLM 审核配置：关键词预筛 + 聊天记录上下文审核

[llm_review]

# 是否启用 LLM 审核能力。仅当 evaluation.strategy=keyword_llm 时生效。
# 示例: true
enabled = true

# 允许进入 LLM 审核的消息类型列表。默认只审合并转发，普通文本和图片不会触发 LLM。
# 示例: ["forward"]
message_types = ["forward"]

# 旧兼容开关。仅当 `llm_review.message_types` 留空时才生效；设为 true 时等价于只审 `forward`。
# 示例: false
only_forward_messages = false

# 是否把消息里的 `[picid:xxx]` 替换为 MaiBot 数据库中已存在的图片描述。图片消息不再支持，默认关闭。
# 示例: false
expand_picid_descriptions = false

# LLM 审核提示词模板。必须只要求模型输出 JSON，字段至少包含 decision 和 reason。
# 示例: {"decision":"allow","reason":"有节目效果"}
prompt_template = "# Role 你是一个严格的群合并转发搬运审核器,只判断当前合并转发是否值得搬到目标群作为节目效果消息。  # Context 当前消息来自群 {group_id},发送者 {user_nickname}({user_id}),消息ID={message_id}。 消息类型:{content_types} 是否包含合并转发:{contains_forward}  # Current Message plain_text: {plain_text}  raw_message: {raw_message}  reply_segments: {reply_segments}  # Recent Chat History {history}  # Core Policy (按优先级)  ## P0 一票否决,任何场景立即 reject 1. 政治内容:涉及国家领导人、政府政策、敏感历史事件、政治立场表态、地缘政治、社会运动、民族宗教冲突、领土争议等任何形式的政治议题,无论立场、无论玩梗、无论二创,一律 reject,不解释。 2. 明显违法违规:真实违法犯罪记录、人肉开盒、儿童色情、暴恐血腥、自残教唆、毒品交易。 3. 明显 NSFW 或色情引流:露点、性器官、性行为、成人视频、约炮广告、色情网站等直接 reject。  ## P1 输入边界 - 只审核当前消息本体是合并转发的消息。若 contains_forward=false,或内容明显只是回复/引用某条合并转发后的普通评论,一律 reject。 - 不支持单独图片搬运。不要根据图片占位符、图片数量或无法确认的图片内容作 allow 判断。 - 如果合并转发主要由图片占位符构成,且没有足够文字上下文证明节目效果,一律 reject。  ## P2 合并转发放行标准 - allow:玩梗、抽象对话、低质段子、轻度冒犯但无实质风险、群友互动产生的明确节目效果。 - allow:合并转发内容自成一体,脱离 Recent Chat History 仍能看懂笑点。 - reject:合并转发内容与 Recent Chat History 有强关联,必须依赖上文语境才能理解(如接续上文话题、回应上文提问、延续上文讨论)。我们只搬完整的梗,不搬只在特定语境下才有意义的聊天片段。 - reject:纯通知、纯求助、纯认真讨论、纯吵架骂战、纯客套、无上下文的普通聊天记录。 - reject:无法判断笑点或节目效果时一律 reject。  # Output 只输出一个 JSON 对象,不要输出任何额外文字: {\"decision\":\"allow|reject\",\"reason\":\"不超过40字\"} "

# 命中即直接拒绝转发的关键词列表。优先级高于 LLM。
# 示例: ["广告", "引流", "nsfw"]
reject_keywords = [
    "nsfw",
    "黄图",
    "裸照",
    "成人视频",
    "约炮",
    "色情网",
    "成人视频资源",
]

# 命中即直接放行的关键词列表。优先级高于 LLM。
# 示例: ["爆典", "神回复"]
pass_keywords = []

# 审核时向消息库回看最近多少小时的聊天记录。
# 示例: 12
history_hours = 20

# 审核时最多带入多少条最近聊天记录。默认值已下调，减少内存和上下文占用。
# 示例: 12
history_limit = 20

# 构建聊天记录时是否过滤 bot 自己的消息。
# 示例: false
history_filter_mai = false

# 构建聊天记录时是否截断超长消息。
# 示例: true
history_truncate = true

# 构建聊天记录时是否展示动作记录。
# 示例: false
history_show_actions = false

# LLM 模型分组。仅当 llm_list 为空时生效。
# 示例: utils
llm_group = "utils"

# 手动指定模型名称列表。非空时优先于 llm_group。
# 示例: ["gemini-2.5-pro", "glm-4.7"]
llm_list = []

# 手动指定模型时的最大输出 token 数。默认值已下调，控制审核开销。
# 示例: 400
max_tokens = 400

# 手动指定模型时的温度。
# 示例: 0.2
temperature = 0.2

# 手动指定模型时的慢请求阈值，单位秒。
# 示例: 30
slow_threshold = 30

# 手动指定模型列表时的模型选择策略。
# 示例: balance
# 可选值: balance, random
selection_strategy = "balance"

